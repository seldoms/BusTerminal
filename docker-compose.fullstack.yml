# =============================================================================
# BusTerminal 全栈部署：应用 + 数据库 + 下载器 + 刮削整理 + 媒体库
# =============================================================================
#
# 这份文件把整条链路要用的服务都写好了，但**只跑这个文件时只会启动 BusTerminal 自己**。
# 其余每个服务都挂在一个 profile 上，装哪些由你决定 —— 已经装过的、
# 或者跑在**别的机器**上的服务，不要启用它的 profile，改成在 .env 里
# 把 BusTerminal 的接入地址指向它即可（见 .env.fullstack.example）。
#
# ⚠️ .env.fullstack.example 为了开箱即用，默认把四个 profile 全开了；
#    照抄它得到的是"五个容器全新建"。只要部分服务时，删掉 COMPOSE_PROFILES 里
#    对应的名字即可。
#
# profile 对照：
#   db        → bus_postgres   PostgreSQL。不启用则 BusTerminal 回退 SQLite
#   qb        → qbittorrent    下载器
#   amane     → amane          刮削 / 整理 / 自动入库
#   jellyfin  → jellyfin       媒体库与播放
#
# 常用命令：
#   # ① 只装 BusTerminal（SQLite，不接任何外部服务）
#   docker compose -f docker-compose.fullstack.yml up -d
#
#   # ② 应用 + 数据库
#   COMPOSE_PROFILES=db docker compose -f docker-compose.fullstack.yml up -d
#
#   # ③ 全栈
#   COMPOSE_PROFILES=db,qb,amane,jellyfin docker compose -f docker-compose.fullstack.yml up -d
#
#   把 COMPOSE_PROFILES 写进 .env 更省事（推荐），见 .env.fullstack.example。
#
# ⚠️ 已经装过的服务不要重复启用，否则会端口冲突 / 容器重名。
# ⚠️ 下面 depends_on 里的 required: false 需要 Docker Compose v2.24+；
#    版本更低时删掉整段 depends_on，改为先起数据库、等它健康后再起应用。
#
# ⚠️⚠️ 这条链路成败的关键不是容器能不能起来，而是**目录能不能对齐**：
#      qB 下载到哪 → BusTerminal 往哪投递 → amane 从哪读 → Jellyfin 从哪读，
#      这四个必须是同一份真实存储。跨机器部署时必须先挂好共享目录（NFS/SMB），
#      否则现象是「下载完成了，但永远不入库」。
#      本文件用 MEDIA_ROOT 一个变量把这件事收拢成两行：
#          ${MEDIA_ROOT}/downloads  → 各容器内的 /downloads（下载区）
#          ${MEDIA_ROOT}/library    → 各容器内的 /media     （媒体库根，含投递区 _incoming）
# =============================================================================

name: ${BUS_STACK_NAME:-busterminal}

services:

  # ------------------------------------------------------------------ 应用本体
  # 不带 profile：只要执行 up 就会被启动，这是整个栈的核心。
  busterminal:
    image: ${BUS_TERMINAL_IMAGE:-ghcr.io/seldoms/busterminal:latest}
    container_name: ${BUS_CONTAINER_NAME:-bus_terminal}
    restart: unless-stopped
    ports:
      - "${BUS_TERMINAL_BIND:-0.0.0.0}:${BUS_TERMINAL_PORT:-8012}:8000"
    volumes:
      # 封面缓存 + 运行配置 + SQLite 回退库。重要性能资产，删了要重新抓几千张封面。
      - ${BUS_DATA_DIR:-./data}:/app/data
      # 下载区。BusTerminal 自己不碰文件，挂进来只是为了做路径核对与本地库存管理。
      - ${MEDIA_ROOT:-./media}/downloads:/downloads
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      # ★ 全新部署必须 true，否则自动建表被跳过、接口报表不存在
      BUS_TERMINAL_ALLOW_SCHEMA_MIGRATION: ${BUS_TERMINAL_ALLOW_SCHEMA_MIGRATION:-true}
      # 登录鉴权。首次部署 true（用 /setup 建管理员）；设 false = 任何人都能删数据
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-}
      # 下载完成后投递到哪（**qB 视角**的路径，且必须落在 amane 的库根内）
      DELIVERY_FOLDER: ${DELIVERY_FOLDER:-/media/_incoming}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # 出网代理（抓境外源站用）。内网服务不要跟随代理，否则 amane/Jellyfin 会被劫持
      SYSTEM_PROXY: ${SYSTEM_PROXY:-}
      BUS_TERMINAL_INTERNAL_PROXY_ENABLED: ${BUS_TERMINAL_INTERNAL_PROXY_ENABLED:-false}
      # ---- 下游服务接入地址 ----
      # 由本栈新建的填容器名；已装或在别处的改成它的真实地址（IP / 域名）
      QB_HOST: ${QB_HOST:-qbittorrent}
      QB_PORT: ${QB_PORT:-8086}
      QB_USERNAME: ${QB_USERNAME:-admin}
      QB_PASSWORD: ${QB_PASSWORD:-}
      AMANE_BASE_URL: ${AMANE_BASE_URL:-http://amane:8000}
      AMANE_TOKEN: ${AMANE_TOKEN:-}
      JELLYFIN_HOST: ${JELLYFIN_HOST:-http://jellyfin:8096}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # ---- 翻译（可选）----
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-google_free}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    depends_on:
      # required: false —— 没启用 db profile 时不要因此报错
      bus_postgres:
        condition: service_healthy
        required: false
    networks:
      - bus_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health/live',timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------ 数据库
  bus_postgres:
    image: ${BUS_PG_IMAGE:-pgvector/pgvector:pg16}
    container_name: ${BUS_PG_CONTAINER:-bus_postgres}
    profiles: ["db"]
    restart: unless-stopped
    environment:
      # ⚠️ 角色名与库名必须一致（都叫 busterminal），改一个就都要改
      POSTGRES_USER: ${BUS_PG_USER:-busterminal}
      POSTGRES_DB: ${BUS_PG_DB:-busterminal}
      # 留空则 PostgreSQL 会拒绝启动 —— 这是刻意的保护，别给它空口令
      POSTGRES_PASSWORD: ${BUS_PG_PASSWORD:-}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # ⚠️ 放机械盘。放 SSD/NVMe 缓存盘会因 4k-fsync 极慢而拖垮容器
      - ${BUS_PG_DATA_DIR:-./pgdata}:/var/lib/postgresql/data
    # 不对外暴露 5432：仅容器网络内可达。要从宿主机连时再加 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUS_PG_USER:-busterminal} -d ${BUS_PG_DB:-busterminal}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - bus_net

  # ------------------------------------------------------------------ 下载器
  qbittorrent:
    image: ${QB_IMAGE:-lscr.io/linuxserver/qbittorrent:latest}
    container_name: ${QB_CONTAINER_NAME:-qbittorrent}
    profiles: ["qb"]
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      # ⚠️ linuxserver 镜像要求：WEBUI_PORT 必须与**容器内**端口一致，
      #    所以下面端口映射写成同号，改端口只改 .env 里的 QB_WEBUI_PORT
      WEBUI_PORT: ${QB_WEBUI_PORT:-8086}
      TORRENTING_PORT: ${QB_TORRENT_PORT:-6881}
    ports:
      - "${QB_WEBUI_PORT:-8086}:${QB_WEBUI_PORT:-8086}"
      - "${QB_TORRENT_PORT:-6881}:${QB_TORRENT_PORT:-6881}"
      - "${QB_TORRENT_PORT:-6881}:${QB_TORRENT_PORT:-6881}/udp"
    volumes:
      - ${QB_CONFIG_DIR:-./qbittorrent/config}:/config
      # 下载区
      - ${MEDIA_ROOT:-./media}/downloads:/downloads
      # ★ 媒体库根也挂进来：BusTerminal 指挥 qB 把下完的文件"移动"到投递区
      #   (/media/_incoming)，qB 必须看得见这个目录，否则投递会失败
      - ${MEDIA_ROOT:-./media}/library:/media
    networks:
      - bus_net

  # ------------------------------------------------------- 刮削 / 整理 / 入库
  amane:
    image: ${AMANE_IMAGE:-ghcr.io/sqzw-x/amane:latest}
    container_name: ${AMANE_CONTAINER_NAME:-amane}
    profiles: ["amane"]
    restart: unless-stopped
    # 对齐宿主机 UID/GID，避免整理出来的文件属主变成 root。
    # 上游镜像默认以 root 跑；若你的环境里以非 root 启动失败（多为 /app 权限问题），
    # 删掉这一行即可 —— 代价是整理出来的文件属主变成 root。
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${AMANE_PORT:-8013}:8000"
    volumes:
      - ${AMANE_DATA_DIR:-./amane/data}:/data
      # 媒体库根。amane 就是在这里发现新文件并整理归档的
      - ${MEDIA_ROOT:-./media}/library:/media
    environment:
      AMANE_DATA_DIR: /data
      # 允许 amane 操作的目录白名单，必须覆盖所有挂进来的媒体路径
      AMANE_SAFE_DIRS: /media
      AMANE_SUPERVISED: "1"
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bus_net

  # ------------------------------------------------------------------ 媒体库
  jellyfin:
    image: ${JELLYFIN_IMAGE:-jellyfin/jellyfin:latest}
    container_name: ${JELLYFIN_CONTAINER_NAME:-jellyfin}
    profiles: ["jellyfin"]
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - ${JELLYFIN_CONFIG_DIR:-./jellyfin/config}:/config
      - ${JELLYFIN_CACHE_DIR:-./jellyfin/cache}:/cache
      # 只读挂载：Jellyfin 只负责展示，不该改动媒体文件
      - ${MEDIA_ROOT:-./media}/library:/media:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - bus_net

networks:
  bus_net:
    name: ${BUS_NETWORK_NAME:-busterminal_net}
    driver: bridge
